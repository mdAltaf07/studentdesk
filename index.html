<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosam Cloth Shop – हर मौसम का नया फैशन</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #fafafa;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 22px;
            color: #ff5733 !important;
        }
        .banner {
            background: url('https://images.pexels.com/photos/298863/pexels-photo-298863.jpeg') center/cover no-repeat;
            height: 300px;
            border-radius: 15px;
            position: relative;
        }
        .banner-overlay {
            backdrop-filter: blur(2px);
            background: rgba(0,0,0,0.4);
            height: 100%;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner h1 {
            color: white;
            font-size: 32px;
            font-weight: 600;
        }
        .cat-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }
        .cat-box:hover {
            transform: translateY(-5px);
        }
        .product-card {
            border-radius: 15px;
            background: white;
            padding: 10px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { border-radius: 10px; }
        footer {
            background: #222;
            color: #bbb;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="uploadbuttons.html">Mosam Cloth Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="#" class="nav-link">होम</a></li>
                <li class="nav-item"><a href="#" class="nav-link">कैटेगरी</a></li>
                <li class="nav-item"><a href="#" class="nav-link">संपर्क</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- BANNER -->
<div class="container mt-4">
    <div class="banner">
        <div class="banner-overlay">
            <h1>हर मौसम का नया फैशन ✨</h1>
        </div>
    </div>
</div>

<!-- CATEGORIES -->
<div class="container mt-5">
    <h3 class="fw-bold mb-4">Shop by Category</h3>
    <div class="row g-4">

        <div class="col-6 col-md-3">
            <div class="cat-box">
                <img src="https://images.pexels.com/photos/428338/pexels-photo-428338.jpeg" width="80" class="mb-2">
                <h6>Men</h6>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="cat-box">
                <img src="https://images.pexels.com/photos/6311659/pexels-photo-6311659.jpeg" width="80" class="mb-2">
                <h6>Women</h6>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="cat-box">
                <img src="https://images.pexels.com/photos/1701205/pexels-photo-1701205.jpeg" width="80" class="mb-2">
                <h6>Kids</h6>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="cat-box">
                <img src="https://images.pexels.com/photos/1488463/pexels-photo-1488463.jpeg" width="80" class="mb-2">
                <h6>Traditional</h6>
            </div>
        </div>

    </div>
</div>

<!-- TRENDING PRODUCTS -->
<div class="container mt-5">
    <h3 class="fw-bold mb-4">Trending Products</h3>

    <div class="row g-4">

        <div class="col-6 col-md-3">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/2983464/pexels-photo-2983464.jpeg" class="w-100" alt="Cloth">
                <h6 class="mt-2">Stylish Shirt</h6>
                <p class="text-danger fw-bold">₹549</p>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/1649771/pexels-photo-1649771.jpeg" class="w-100" alt="Cloth">
                <h6 class="mt-2">Casual T-Shirt</h6>
                <p class="text-danger fw-bold">₹399</p>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/6311659/pexels-photo-6311659.jpeg" class="w-100" alt="Cloth">
                <h6 class="mt-2">Women Kurti</h6>
                <p class="text-danger fw-bold">₹799</p>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/462235/pexels-photo-462235.jpeg" class="w-100" alt="Cloth">
                <h6 class="mt-2">Kids Wear</h6>
                <p class="text-danger fw-bold">₹299</p>
            </div>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>
    <p>© 2025 Mosam Cloth Shop – जहाँ स्टाइल मिलता है सादगी से 👕✨</p>
</footer>

</body>
</html>
