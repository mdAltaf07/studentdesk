
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .profile-card {
            width: 320px;
            padding: 35px 25px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #764ba2;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .instagram {
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }

        .whatsapp {
            background: #25D366;
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img
            src="https://placehold.co/200x200"
            alt="Profile Photo"
            class="profile-img"
        >

        <h1>Sohail</h1>
        <p>Welcome to my profile!</p>

        <a
            href="https://www.instagram.com/im_sohial?obrf=eG05Z2Y3M295dXQ="
            target="_blank"
            rel="noopener noreferrer"
            class="btn instagram"
        >
            Instagram
        </a>

        <a
            href="https://wa.me/917000862604"
            target="_blank"
            rel="noopener noreferrer"
            class="btn whatsapp"
        >
            WhatsApp
        </a>

    </div>

</body>
</html>
